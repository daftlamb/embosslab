<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emboss Lab WebGL Prototype</title>
<style>
html,body{height:100%;margin:0;background:#171412;color:#eee;font-family:Arial,sans-serif}
.wrap{height:100%;display:grid;grid-template-columns:260px 1fr}
aside{padding:16px;background:#211c18;border-right:1px solid #3a312a}
canvas{width:100%;height:100%;display:block}
label{display:block;margin:14px 0 6px;color:#cfc5ba;font-size:12px}
input,select{width:100%}
.uploadBtn{width:100%;min-height:34px;margin-top:8px;border:1px solid #5b4d43;border-radius:6px;background:#322a24;color:#eee;cursor:pointer}
#file{display:block;margin-top:8px;color:#ddd}
#dropZone{margin-top:8px;padding:14px;border:1px dashed #67594e;border-radius:6px;color:#b7aa9e;font-size:12px;line-height:1.35}
#dropZone.drag{border-color:#d3c2b5;background:#2b241f;color:#f2e9df}
</style>
</head>
<body>
<div class="wrap">
  <aside>
    <h1>WebGL Relief</h1>
    <label>Image</label>
    <input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml">
    <div id="dropZone">Drop an image here</div>
    <div id="loadStatus" style="margin-top:8px;color:#9f9286;font-size:12px;line-height:1.35">Sample loaded</div>
    <label>Material</label>
    <select id="material"><option value="paper">Paper</option><option value="silver" selected>Silver</option><option value="chrome">Chrome Plate</option><option value="wax">Wax</option></select>
    <label>Environment</label>
    <select id="environment"><option value="generated" selected>Studio Generated</option><option value="story">Story Studio HDR</option><option value="small">Small Studio HDR</option></select>
    <label>Plate texture</label>
    <select id="plateTexture"><option value="tl269" selected>Texturelabs 269</option><option value="tl277">Texturelabs 277</option><option value="1">Plate 1</option><option value="2">Plate 2</option><option value="3">Plate 3</option><option value="4">Plate 4</option></select>
    <button id="randomPlate" class="uploadBtn" type="button">Random plate</button>
    <label>View</label>
    <select id="viewMode"><option value="0" selected>Relief</option><option value="1">Plate texture</option><option value="2">Height map</option></select>
    <label>Height <span id="heightVal"></span></label>
    <input id="height" type="range" min="0" max="100" value="58">
    <label>Angle <span id="angleVal"></span></label>
    <input id="angle" type="range" min="-180" max="180" value="-38">
    <label>Roughness <span id="roughVal"></span></label>
    <input id="rough" type="range" min="0" max="100" value="30">
    <label>Metallic <span id="metallicVal"></span></label>
    <input id="metallic" type="range" min="0" max="100" value="78">
    <label>Env rotation <span id="envRotVal"></span></label>
    <input id="envRot" type="range" min="-180" max="180" value="-32">
  </aside>
  <canvas id="gl"></canvas>
</div>

function uploadEnv(source,isHdr,flipY){

  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,source);
  gl.activeTexture(gl.TEXTURE0);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);

}
function useGeneratedEnv(){
  uploadEnv(createStudioEnv(),false,false);

}
function loadRealEnv(name){
  var files={story:'assets/env/story-studio-05-rgbe.png',small:'assets/env/studio-small-01-rgbe.png'};
  if(!files[name]){useGeneratedEnv();return}
  var img=new Image();
  img.onload=function(){uploadEnv(img,true,true);setStatus('HDR env loaded')};
  img.onerror=function(){setStatus('HDRI image failed, using generated env.')};
  img.src=files[name];
}
function updateEnvironment(){
  var value=controls.environment.value;
  if(value==='generated')useGeneratedEnv();
  else loadRealEnv(value);
}

    img.src=reader.result;
  };
  reader.readAsDataURL(file);
}
var fileInput=document.getElementById('file');
fileInput.addEventListener('change',function(){loadFile(this.files&&this.files[0]);this.value=''});
fileInput.addEventListener('input',function(){loadFile(this.files&&this.files[0]);this.value=''});
var dropZone=document.getElementById('dropZone');
function bindDrop(target){
  ['dragenter','dragover'].forEach(function(type){target.addEventListener(type,function(e){e.preventDefault();dropZone.classList.add('drag')})});
  ['dragleave','drop'].forEach(function(type){target.addEventListener(type,function(e){e.preventDefault();dropZone.classList.remove('drag');if(type==='drop'&&e.dataTransfer&&e.dataTransfer.files.length)loadFile(e.dataTransfer.files[0])})});
}
bindDrop(dropZone);
bindDrop(canvas);
bindDrop(document.body);
addEventListener('resize',render);seed();loadPlateTexture();
})();
</script>
</body>
